<!doctype html><html><head><meta charset="utf-8"><title>Listener attachment mail</title><script defer src="options.js"></script></head><body><h1>Listener attachment mail</h1><p>Only incoming messages with attachments are reported. No subject, body or file contents are sent. Received date means when Thunderbird notified this add-on.</p><form id="settings"><label><input id="enabled" type="checkbox">Enable collection</label><p><label>Local Agent port <input id="port" type="number" min="1024" max="65535" value="58766" required></label></p><p><label>Agent mail token <input id="token" type="password" minlength="32" autocomplete="off"></label></p><button>Save</button></form><p id="status" role="status"></p></body></html>
